# Machine-checkable naming rules for scripts/lint-tmdl.py.
# Mostly enforces Microsoft's naming-conventions.md (no technical prefixes, keys hidden);
# the firm additions are measures_table (MOD-03) and the description/format requirement (DAX-04).
version: 1
tables:
  case: title            # Title Case
  singular: true
  forbidden_prefixes: [dbo_, vw_, stg_, dim_, fact_, tbl_]
  measures_table: _Measures
  date_table: Date
columns:
  case: title
  forbidden_prefixes: [dbo_, src_, col_]
  key_suffix: Key
  keys_hidden: true
measures:
  case: title
  require_description: true
  require_format_string: true
roles:
  prefix: "RLS - "
technical_columns:
  prefix: "_"
  hidden: true
