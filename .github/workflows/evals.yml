name: Evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Guard — vendor/ untouched except by submodule bump
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^vendor/.+' ; then
            echo "::error::Files inside vendor/ were modified. Only the submodule pointer may change." ; exit 1 ; fi

      - name: Lint fixture models with firm naming rules
        run: |
          set -e
          for f in $(find evals/fixtures -name '*.tmdl'); do python3 scripts/lint-tmdl.py "$f" skills/standards/naming.yaml; done

      - name: PBIR JSON is well-formed
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = [str(f) for f in pathlib.Path("clients").rglob("*.Report/**/*.json") if not (lambda f: json.loads(f.read_text()) or True)(f)]
          print("ok")
          PY

      - name: Validate rules JSON / plugin manifest
        run: |
          python3 -c "import json;json.load(open('skills/standards/bpa-rules.json'));json.load(open('.claude-plugin/plugin.json'));json.load(open('hooks/hooks.json'))"

      - name: Scenario evals (agent-in-the-loop)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: evals/run.sh
        # NOTE: CI exercises the TMDL / REST fallback paths only. The Power BI Modeling MCP needs
        # Power BI Desktop running locally, so MCP-path scenarios are tagged `local-only` and skipped here.
