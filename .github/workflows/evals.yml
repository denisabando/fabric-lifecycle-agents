name: Evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — vendor/ untouched except by submodule bump
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^vendor/.+' ; then
            echo "::error::Files inside vendor/ were modified. Only the submodule pointer may change." ; exit 1 ; fi

      - name: Validate rules JSON / plugin manifest
        run: |
          node -e "for (const f of ['skills/semantic-model/bpa-rules.json','.claude-plugin/plugin.json','hooks/hooks.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"

      - name: Trail check on the demo client (report only — history predates the trailers)
        run: node scripts/check-trail.js clients/acme-demo --report-only

      - name: Scenario evals (agent-in-the-loop)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node evals/run.js
        # NOTE: CI exercises the TMDL / REST fallback paths only. The Power BI Modeling MCP needs
        # Power BI Desktop running locally, so MCP-path scenarios are tagged `local-only` and skipped here.
