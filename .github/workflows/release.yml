name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V=$(node -p "require('./.claude-plugin/plugin.json').version")
          [ "$TAG" = "$V" ] || { echo "::error::plugin.json version $V != tag $TAG"; exit 1; }
      - name: Package
        run: |
          git archive --format=tar.gz -o fabric-lifecycle-agents-${GITHUB_REF_NAME}.tar.gz HEAD
          (cd vendor/skills-for-fabric && git rev-parse HEAD) > VENDOR_SHA.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric-lifecycle-agents-*.tar.gz
            VENDOR_SHA.txt
          body_path: CHANGELOG.md
