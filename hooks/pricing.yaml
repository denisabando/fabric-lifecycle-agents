# Price table for cost estimates in the audit trail. USD per 1,000,000 tokens.
# ESTIMATES ONLY — verify against https://www.anthropic.com/pricing and update `checked`.
# Cost lines in audit/<date>.jsonl carry pricing_checked so a stale table is visible.
checked: 2026-09-02
source: anthropic.com/pricing (via benchlm.ai snapshot 2026-09-02)
models:
  claude-fable-5-1:        { input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 0.25 }
  claude-mythos-5:         { input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 1.00 }
  claude-opus-5:           { input:  5.00, output: 25.00, cache_write:  6.25, cache_read: 0.50 }
  claude-sonnet-5:         { input:  2.00, output: 10.00, cache_write:  2.50, cache_read: 0.20 }
  claude-haiku-4-5:        { input:  1.00, output:  5.00, cache_write:  1.25, cache_read: 0.10 }
# Unknown model ids fall back to `default` and the Usage event is flagged priced_as: default.
default:                   { input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 1.00 }
